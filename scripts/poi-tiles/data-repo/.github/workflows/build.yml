# Wöchentlicher Build der statischen POI-Kacheln (Europa) für Camp Finder.
# Lebt im Daten-Repo fenta23/camp-finder-data; die Vorlage liegt in
# stellplatz-maps-finder/scripts/poi-tiles/data-repo/.
#
# Pro Land (drei parallel): Geofabrik-Extrakt laden → osmium tags-filter →
# Original löschen (europe-latest.osm.pbf am Stück wäre 35 GB). Danach alles
# mergen (dedupliziert Grenzobjekte: gleiche ID + Version), Kacheln bauen und
# direkt als Pages-Artefakt deployen. Committet wird nur STAND.md: GitHub
# deaktiviert Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Repo-Aktivität,
# ohne Commit würden die Kacheln nach ~2 Monaten still veralten.

name: Build POI tiles

on:
  schedule:
    - cron: '17 3 * * 1' # Montag 03:17 UTC (Geofabrik-Extrakte sind dann frisch)
  workflow_dispatch:

permissions:
  contents: write # STAND.md (Keepalive)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Sammelregionen, die sich mit Ländern überschneiden (kosten nur Zeit).
      SKIP_REGIONS: 'alps dach britain-and-ireland united-kingdom'
      WORK: /mnt/work
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          df -h / /mnt

      - name: Checkout app (filter definitions + build script)
        uses: actions/checkout@v4
        with:
          repository: fenta23/stellplatz-maps-finder
          path: app

      - name: Checkout data repo (README)
        uses: actions/checkout@v4
        with:
          path: data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
          osmium --version | head -1
          cd app && npm ci

      - name: Download + filter countries
        working-directory: app
        run: |
          npx tsx scripts/poi-tiles/build.ts --expressions > "$WORK/expressions.txt"
          cat "$WORK/expressions.txt"
          mkdir -p "$WORK/filtered"
          curl -sSfL --speed-limit 50000 --speed-time 60 --retry 8 --retry-delay 60 --retry-all-errors \
            https://download.geofabrik.de/index-v1-nogeom.json -o "$WORK/index.json"
          jq -r --arg skip "$SKIP_REGIONS" '
            ($skip | split(" ")) as $s
            | .features[].properties
            | select(.parent == "europe" and (.id as $id | $s | index($id) | not))
            | "\(.id) \(.urls.pbf)"' "$WORK/index.json" > "$WORK/regions.txt"
          echo "$(wc -l < "$WORK/regions.txt") Regionen"
          # Ein Land: laden → filtern → Original löschen. Drei parallel (4 Kerne,
          # max. ~3 × 4,5 GB auf der Platte). curl bricht ab, wenn weniger als
          # 50 KB/s über 60 s ankommen (Geofabrik hing schon einmal mit offener
          # Verbindung), und versucht es bis zu 8× neu.
          cat > "$WORK/region.sh" <<'EOS'
          #!/usr/bin/env bash
          set -euo pipefail
          id=$1 url=$2 tmp="$WORK/in-$1.osm.pbf" start=$(date +%s)
          curl -sSfL --speed-limit 50000 --speed-time 60 \
               --retry 8 --retry-delay 60 --retry-all-errors -o "$tmp" "$url"
          size=$(du -h "$tmp" | cut -f1)
          osmium tags-filter "$tmp" -e "$WORK/expressions.txt" -O -o "$WORK/filtered/$id.osm.pbf"
          rm "$tmp"
          echo "$id: $size → $(du -h "$WORK/filtered/$id.osm.pbf" | cut -f1) in $(( $(date +%s) - start ))s"
          EOS
          chmod +x "$WORK/region.sh"
          xargs -P 3 -L 1 "$WORK/region.sh" < "$WORK/regions.txt"
          echo "$(ls "$WORK/filtered" | wc -l) von $(wc -l < "$WORK/regions.txt") Regionen gefiltert"

      - name: Merge
        run: |
          osmium merge "$WORK"/filtered/*.osm.pbf -O -o "$WORK/europe-filtered.osm.pbf"
          rm -rf "$WORK/filtered"
          osmium fileinfo -e "$WORK/europe-filtered.osm.pbf" | grep -A3 'Number of nodes'

      - name: Build tiles
        working-directory: app
        env:
          NODE_OPTIONS: --max-old-space-size=12288
          # ~50 % der erwarteten Europa-Mengen (3,9 Mio. / 0,3 Mio.): ein kaputter
          # Filter-Schritt bricht hier ab, statt leere Kacheln zu deployen — die
          # alte Version bleibt dann online.
          POI_TILES_MIN_PARKING: 2000000
          POI_TILES_MIN_REST: 150000
        run: |
          VERSION=$(date -u +%F)
          npx tsx scripts/poi-tiles/build.ts "$WORK/europe-filtered.osm.pbf" "$WORK/site" "$VERSION"
          cp ../data/README.md "$WORK/site/README.md"
          touch "$WORK/site/.nojekyll"
          du -sh "$WORK/site"; du -sh "$WORK/site/$VERSION"/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: /mnt/work/site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit STAND.md (keepalive)
        working-directory: data
        run: |
          jq -r '"# Stand\n\n- Build: \(.date) (`\(.version)`)\n- Parkplätze: \(.counts.parking) POIs in \(.tiles.parking | length) Kacheln\n- Rest: \(.counts.rest) POIs in \(.tiles.rest | length) Kacheln\n\nDaten © OpenStreetMap-Mitwirkende, ODbL."' \
            "$WORK/site/manifest.json" > STAND.md
          cat STAND.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add STAND.md
          git diff --cached --quiet || { git commit -m "Stand $(jq -r .date "$WORK/site/manifest.json")" && git push; }
