<section class="planner-panel" hidden>
  <div class="planner-full" data-ref="full">
    <div class="planner-fields">
      <div class="planner-field" data-role="start">
        <span class="planner-dot planner-dot-start" aria-hidden="true"></span>
        <div class="planner-input-wrap">
          <input class="planner-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-ref="startInput" />
          <ul data-ref="startList"></ul>
        </div>
        <button class="planner-icon-btn" type="button" data-ref="startLocate" aria-label="Start: Mein Standort" title="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="planner-icon-btn" type="button" data-ref="startPick" aria-label="Start auf Karte wählen" title="Auf Karte wählen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></button>
      </div>

      <button class="planner-icon-btn planner-swap" type="button" data-ref="swap" aria-label="Start und Ziel tauschen" title="Start und Ziel tauschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/></svg></button>

      <div class="planner-field" data-role="end">
        <span class="planner-dot planner-dot-end" aria-hidden="true"></span>
        <div class="planner-input-wrap">
          <input class="planner-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-ref="endInput" />
          <ul data-ref="endList"></ul>
        </div>
        <button class="planner-icon-btn" type="button" data-ref="endLocate" aria-label="Ziel: Mein Standort" title="Mein Standort"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="planner-icon-btn" type="button" data-ref="endPick" aria-label="Ziel auf Karte wählen" title="Auf Karte wählen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg></button>
      </div>
    </div>

    <div class="planner-modes" role="radiogroup" aria-label="Verkehrsmittel" data-ref="modes">
      <button class="planner-mode" type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 16v-2.38C4 11.5 2.97 10.5 3 8c.03-2.72 1.49-6 4.5-6C9.37 2 10 3.8 10 5.5c0 3.11-2 5.66-2 8.68V16a2 2 0 1 1-4 0Z"/><path d="M20 20v-2.38c0-2.12 1.03-3.12 1-5.62-.03-2.72-1.49-6-4.5-6C14.63 6 14 7.8 14 9.5c0 3.11 2 5.66 2 8.68V20a2 2 0 1 0 4 0Z"/><path d="M16 17h4"/><path d="M4 13h4"/></svg><span>Fuß</span></button>
      <button class="planner-mode" type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="bike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg><span>Rad</span></button>
      <button class="planner-mode" type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="car"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/></svg><span>Auto</span></button>
    </div>

    <button class="planner-go" type="button" data-ref="go" disabled>Route berechnen</button>
    <p class="planner-status" role="status" aria-live="polite" data-ref="status"></p>
    <button class="planner-link" type="button" data-ref="importLink" hidden>Route importieren / gespeicherte Routen</button>
  </div>

  <div class="planner-pick" data-ref="pick" hidden>
    <span data-ref="pickText"></span>
    <span aria-hidden="true">·</span>
    <button class="planner-pick-cancel" type="button" data-ref="pickCancel">Abbrechen</button>
  </div>
</section>
